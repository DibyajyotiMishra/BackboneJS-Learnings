<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/handlebars.js"></script>
    <script src="js/underscore-umd-min.js"></script>
    <script src="js/backbone-min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Handlebars Backbone</title>
</head>
<body>
    <div id="content"></div>
    <script id="templ-handlebars" type="text/x-handlebars-template">
        <table class="table table-hover ml-5 mr-5">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Team</th>
                    <th scope="col">Position</th>
                </tr>
            </thead>
            <tbody>
                {{#each players}}
                <tr>
                    <td>{{this.name}}</td>
                    <td>{{this.team}}</td>
                    <td>{{this.position}}</td>
                </tr>
                {{/each}}
            </tbody>
        </table>
    </script>
    <script src="./handlebars_backbone.js"></script>
</body>
</html>
