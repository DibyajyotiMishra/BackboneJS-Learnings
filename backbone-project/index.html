<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/underscore-umd-min.js"></script>
    <script src="libs/backbone-min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Backbone Project</title>
</head>

<body>
    <div class="container mx-4 my-3">
        <h1>Backbone App</h1>
        <table class="table">
            <thead>
                <tr>
                    <th>Author</th>
                    <th>Title</th>
                    <th>URL</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td><input type="text" placeholder="John Doe" class="form-control" id="author-input"></td>
                    <td><input type="text" class="form-control" placeholder="My Awesome Blog" id="title-input"></td>
                    <td><input type="text" class="form-control" placeholder="www.example.com/blogs/123" id="url-input">
                    </td>
                    <td>
                        <buttton class="btn btn-outline-primary rounded" id="add-blog">Add</buttton>
                    </td>
                </tr>
            </thead>
            <tbody id="blogs-list">

            </tbody>
        </table>
    </div>
    <script src="./app.js"></script>
    <script type="text/template" id="blogs-list-template">
        <td><span id="author"><%= author %></span></td>
        <td><span id="title"><%= title %></span></td>
        <td><span id="url"><%= url %></span></td>
        <td>
            <div id="read">
            <button class="btn btn-outline-warning rounded" id="edit-blog">Edit</button>
            <button class="btn btn-outline-danger rounded" id="delete-blog">Delete</button>
            </div>
            <div id="edit" style="display:none">
            <button class="btn-outline-success rounded" id="update-blog">Update</button>
            <button class="btn btn-outline-danger rounded" id="cancel-blog">Cancel</button>
            </div>
        </td>
    </script>

</body>

</html>
